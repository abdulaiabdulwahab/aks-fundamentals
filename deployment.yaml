apiVersion: apps/v1
kind: Deployment

metadata:
  # Deployment name
  name: nginx-web

  # Put the deployment in our namespace
  namespace: foundations

spec:
  # Run two copies of the application
  replicas: 2

  selector:
    matchLabels:
      app: nginx-web

  template:
    metadata:
      labels:
        # The Service will later use this label
        app: nginx-web

    spec:
      containers:
        - name: nginx

          # Container image
          image: nginx:1.28-alpine

          ports:
            - containerPort: 80